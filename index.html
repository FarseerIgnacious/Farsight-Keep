<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Farsight Keep</title>
  <style>
    @font-face {
      font-family: 'Cinzel';
      src: url('assets/Fonts/Cinzel-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }
    @font-face {
      font-family: 'Grenze';
      src: url('assets/Fonts/Grenze-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Grenze';
      src: url('assets/Fonts/Grenze-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Grenze';
      src: url('assets/Fonts/Grenze-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
    }

    :root {
      --app-font: 'Cinzel', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1416 url('assets/Background.png') left -40px/1641px auto no-repeat fixed;
      color: #e0d5c5;
      font-family: var(--app-font);
      height: 100vh;
      overflow: hidden;
    }
    #app { height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a1220; }
    ::-webkit-scrollbar-thumb { background: #2a3a5a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a9a9a; }
    input[placeholder*="Search"]::placeholder,
    input[placeholder*="Filter"]::placeholder { color: #1E231A; opacity: 1; }
    input[placeholder*="Search"]::-webkit-input-placeholder,
    input[placeholder*="Filter"]::-webkit-input-placeholder { color: #1E231A; }

    /* Font-specific sizing and spacing */
    body.font-grenze {
      font-size: 17px !important;
      letter-spacing: 0.05em !important;
    }
    body.font-grenze * {
      font-size: 1em !important;
      letter-spacing: 0.05em !important;
    }

    body.font-times {
      font-size: 16px !important;
      letter-spacing: 0.05em !important;
    }
    body.font-times * {
      font-size: 1em !important;
      letter-spacing: 0.05em !important;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1416;
      transition: opacity 0.5s ease;
    }
    #splash-screen.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #splash-content.splash-visible {
      opacity: 1;
    }
    #splash-art {
      width: 320px;
      max-width: 55vw;
      height: auto;
      aspect-ratio: 1 / 1;
      margin-bottom: 24px;
      object-fit: contain;
    }
    #splash-title {
      font-size: 30px;
      font-weight: bold;
      color: #e0d5c5;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    #splash-tagline {
      font-size: 15px;
      color: #8a7d6a;
      font-style: italic;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div id="splash-content">
      <img id="splash-art" src="assets/Ignacious_Profile.png" alt="Ignacious">
      <div id="splash-title">Farsight Keep</div>
      <div id="splash-tagline">Peer into infinite stories</div>
    </div>
  </div>
  <div id="app"></div>
  <script src="renderer.js"></script>
  <script src="monster-builder.js"></script>
  <script src="spell-builder.js"></script>
  <script src="npc-builder.js"></script>
  <script src="pc-builder.js"></script>
</body>
</html>
